<dialog class="product-detail-dialog" id="product-detail-dialog" aria-labelledby="detail-name">
  <button class="detail-close" type="button" data-detail-close aria-label="Close product details">×</button>
  <div class="detail-layout">
    <div class="detail-image-wrap"><img data-detail-image src="" alt=""></div>
    <div class="detail-copy">
      <p class="detail-kicker" data-detail-vendor></p>
      <h2 id="detail-name" data-detail-name></h2>
      <strong class="detail-price" data-detail-price></strong>
      <p class="detail-description" data-detail-description></p>
      <div class="detail-options" data-detail-colors-wrap><p>Choose a color to preview</p><div class="detail-swatches" data-detail-colors></div><span class="detail-selection" data-detail-color-label></span></div>
      <div class="detail-options"><p data-detail-size-heading>Available sizes</p><div class="detail-sizes" data-detail-sizes></div></div>
      <a class="detail-shop-link" data-detail-link href="#" target="_blank" rel="noopener noreferrer">View original piece <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</dialog>
